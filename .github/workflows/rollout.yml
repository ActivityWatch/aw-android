name: Rollout

# Widen or complete the staged Play production rollout that a stable release
# starts at (see release.yml). Check Play vitals for the new versionCode first:
# crash and ANR clusters show up within hours.
#
# Finish what you start: Release refuses to start a new stable release while a
# production rollout is still in progress, because Play keeps one in-progress
# release per track and the new one would silently replace it (v0.14.3
# replacing v0.14.2 at 50%, 2026-10-11). Complete it here with 1.0, or halt it
# in Play Console, before the next stable release.
#
# Usage: Actions → Rollout → Run workflow → pick the fraction (1.0 completes it).

on:
  workflow_dispatch:
    inputs:
      fraction:
        description: 'Production rollout fraction to set for the current staged release'
        required: true
        default: '0.5'
        type: choice
        options: ['0.25', '0.5', '1.0']
      version_code:
        description: 'versionCode of the in-progress release (default: highest on the production track)'
        required: false
        type: string

jobs:
  rollout:
    name: Set production rollout to ${{ inputs.fraction }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # version set by .ruby-version
      - name: Set up Ruby and install fastlane
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Load Fastlane API credentials
        env:
          KEY_FASTLANE_API_B64: ${{ secrets.KEY_FASTLANE_API_B64 }}
        run: |
          set -euo pipefail
          if [ -z "${KEY_FASTLANE_API_B64:-}" ]; then
            echo "KEY_FASTLANE_API_B64 secret is not set; cannot roll out" >&2
            exit 1
          fi
          printf '%s' "$KEY_FASTLANE_API_B64" | base64 --decode \
            > fastlane/api-8546008605074111507-287154-450dc77b365f.json
          chmod 600 fastlane/api-8546008605074111507-287154-450dc77b365f.json

      - name: Update rollout
        run: |
          gem sources --add https://rubygems.org
          bundle exec fastlane rollout fraction:"${{ inputs.fraction }}" version_code:"${{ inputs.version_code }}"
          {
            echo "## Play production rollout"
            echo "- fraction: \`${{ inputs.fraction }}\`"
            echo "- versionCode: \`${{ inputs.version_code || 'highest on production track' }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
